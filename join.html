<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="section">

    <h1 class="section-title">Prijavi se</h1>

    <p class="section-subtitle">
        Sekcija je namenjena učenicima zainteresovanim za razvoj softvera,
        programiranje, dizajn sistema i timski rad.
    </p>

    <div class="card">

        <form>

            <div style="display:flex; flex-direction:column; gap:1rem;">

                <input type="text" placeholder="Ime i prezime" style="padding:1rem; border-radius:12px; border:none; background:#0f172a; color:white;">

                <input type="email" placeholder="Email" style="padding:1rem; border-radius:12px; border:none; background:#0f172a; color:white;">

                <textarea placeholder="Zašto želiš da se pridružiš sekciji?" rows="6" style="padding:1rem; border-radius:12px; border:none; background:#0f172a; color:white;"></textarea>

                <button class="button">Pošalji prijavu</button>

            </div>

        </form>

    </div>

</section>

</body>
</html>
